name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '[0-9]+*'
      - '*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Criar nova Release no GitHub com esta tag (ex: 0.1.3 ou v0.1.3). Deixe vazio para apenas gerar o APK para download.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          touch .env
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew
          ls -la debug.keystore

      - name: Build Debug APK
        run: |
          TAG_NAME="${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          CLEAN_VERSION=$(echo "$TAG_NAME" | sed -e 's|^refs/tags/||' -e 's|^v||')
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "main" ] || [ "$CLEAN_VERSION" = "master" ]; then
            CLEAN_VERSION="0.1.2"
          fi
          echo "Compilando APK com versionName='$CLEAN_VERSION' a partir da tag '$TAG_NAME'"
          ./gradlew assembleDebug -PversionName="$CLEAN_VERSION" --no-daemon --no-configuration-cache

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          TAG_NAME="${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="0.1.2"

          # Find the generated APK
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "release-output/FinanFlow-${TAG_NAME}.apk"
            cp "$APK_PATH" "release-output/app-debug.apk"
          else
            echo "Error: No APK file found in app/build/outputs/apk/"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-APK
          path: release-output/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

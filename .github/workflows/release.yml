name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          # Accept Android licenses
          yes | sdkmanager --licenses 2>/dev/null || true

          # Create .env if missing
          touch .env

          # Restore debug keystore from file, inline data, or generate with keytool
          if [ -f debug.keystore.base64 ]; then
            (base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null) || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Restoring keystore from embedded base64..."
            echo "" | (base64 --decode > debug.keystore 2>/dev/null || base64 -d > debug.keystore 2>/dev/null) || true
          fi

          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Copy to app directory as well just in case
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          echo "Debug keystore ready:"
          ls -la debug.keystore

          # Ensure gradlew is executable
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          TAG_NAME="${{ github.ref_name }}"
          [ -z "$TAG_NAME" ] && TAG_NAME="latest"

          # Find the generated APK
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "release-output/FinanFlow-${TAG_NAME}.apk"
            cp "$APK_PATH" "release-output/app-debug.apk"
          else
            echo "Error: No APK file found in app/build/outputs/apk/"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanFlow-APK
          path: release-output/*.apk
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}